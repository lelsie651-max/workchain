<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - WorkChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body class="min-h-full bg-slate-950 text-slate-100">
    <div class="mx-auto min-h-screen max-w-7xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
        <header class="mb-6 border-b border-slate-800 pb-5 sm:mb-8 sm:pb-6">
            <div class="flex flex-wrap items-start justify-between gap-4">
                <a href="/" class="flex min-h-11 flex-1 items-start gap-3">
                    <div class="rounded-xl border border-cyan-400/30 bg-cyan-400/10 px-3 py-2 text-sm font-semibold tracking-wide text-cyan-200">
                        WorkChain
                    </div>
                    <div class="min-w-0">
                        <h1 class="text-2xl font-semibold tracking-tight text-white sm:text-3xl">WorkChain</h1>
                        <p class="mt-1 text-sm leading-6 text-slate-400">「这不是我要的」? —— 自动留证 · 不可篡改 · 可第三方验证</p>
                    </div>
                </a>
                <div class="flex items-center gap-3">
                    <form action="/search" method="get" class="hidden items-center gap-2 rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2 lg:flex">
                        <span class="text-slate-500">🔎</span>
                        <input
                            type="text"
                            name="q"
                            value="{{ current_search_q|default('') }}"
                            placeholder="搜索记录"
                            class="w-48 bg-transparent text-sm text-slate-100 outline-none placeholder:text-slate-500"
                        >
                    </form>
                    <button
                        id="mobile-search-toggle"
                        type="button"
                        class="inline-flex min-h-11 items-center rounded-xl border border-slate-700 px-3 py-2 text-sm text-slate-200 transition hover:border-cyan-400/40 hover:text-white lg:hidden"
                        aria-label="打开搜索"
                    >
                        🔎
                    </button>
                    <a
                        href="/help"
                        class="inline-flex min-h-11 items-center rounded-xl border border-slate-700 px-4 py-2 text-sm text-slate-200 transition hover:border-cyan-400/40 hover:text-white"
                    >
                        使用说明
                    </a>
                </div>
            </div>
            <form id="mobile-search-form" action="/search" method="get" class="mt-4 hidden items-center gap-2 rounded-xl border border-slate-800 bg-slate-900/70 px-3 py-2 lg:hidden">
                <span class="text-slate-500">🔎</span>
                <input
                    type="text"
                    name="q"
                    value="{{ current_search_q|default('') }}"
                    placeholder="搜索记录"
                    class="w-full bg-transparent text-sm text-slate-100 outline-none placeholder:text-slate-500"
                >
            </form>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="mt-10 border-t border-slate-800 pt-5 text-sm text-slate-500">
            <div class="flex flex-wrap items-center gap-x-2 gap-y-1">
                <span>演示数据</span>
                <span>·</span>
                <a
                    href="https://github.com/lelsie651-max/workchain"
                    target="_blank"
                    rel="noreferrer"
                    class="transition hover:text-slate-300"
                >
                    项目仓库
                </a>
                <span>·</span>
                <a href="/help" class="transition hover:text-slate-300">使用说明</a>
            </div>
        </footer>
    </div>
    <script>
        (() => {
            const mobileToggle = document.getElementById("mobile-search-toggle");
            const mobileForm = document.getElementById("mobile-search-form");
            if (!mobileToggle || !mobileForm) {
                return;
            }
            mobileToggle.addEventListener("click", () => {
                mobileForm.classList.toggle("hidden");
                const input = mobileForm.querySelector("input[name='q']");
                if (input && !mobileForm.classList.contains("hidden")) {
                    input.focus();
                }
            });
        })();
    </script>
</body>
</html>
