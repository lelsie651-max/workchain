<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} - WorkChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body class="min-h-full bg-slate-950 text-slate-100">
    <div class="mx-auto min-h-screen max-w-6xl px-4 py-6 sm:px-6 sm:py-8 lg:px-8">
        <header class="mb-6 border-b border-slate-800 pb-5 sm:mb-8 sm:pb-6">
            <a href="/" class="inline-flex min-h-11 items-center gap-3">
                <div class="rounded-xl border border-cyan-400/30 bg-cyan-400/10 px-3 py-2 text-sm font-semibold tracking-wide text-cyan-200">
                    WorkChain
                </div>
                <div>
                    <p class="text-lg font-semibold tracking-tight text-white">WorkChain</p>
                    <p class="mt-1 text-sm text-slate-400">自动留证 · 不可篡改 · 可第三方验证</p>
                </div>
            </a>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
